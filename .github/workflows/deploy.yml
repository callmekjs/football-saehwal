# main 에 push 될 때마다 프로덕션 빌드를 만들어 GitHub Pages 에 올린다.
#
# 이 방식은 저장소에 커밋을 만들지 않는다. 빌드 결과를 파일 묶음으로
# 올릴 뿐이라 대회 마감(2026-08-03 10:00) 이후에도 커밋 이력이 늘지 않는다.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 새 배포가 시작되면 진행 중이던 것은 끝까지 두고
# 대기 중이던 것만 취소한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # npm run build 는 tsc --noEmit 을 먼저 돌린다.
      # 타입 오류가 있으면 여기서 멈추고 이전 배포본이 그대로 살아 있다.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 게시
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
